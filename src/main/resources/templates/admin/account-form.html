<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
  <title>Thêm / Sửa Tài Khoản - Vườn Hoa Tươi Admin</title>
</head>
<body>
  <div layout:fragment="content">
<div class="admin-content">
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Đã cập nhật thông tin tài khoản!'); window.location.href=\'/admin/accounts\';">
          <div class="page-header-row">
            <div class="page-header-text">
              <h2>Cấu Hình Tài Khoản Người Dùng</h2>
              <p>Tạo mới hoặc chỉnh sửa thông tin đăng nhập và vai trò quản trị.</p>
            </div>
            <div style="display:flex; gap:12px;">
              <a th:href="@{/admin/accounts}" href="/admin/accounts" class="btn btn-outline">Hủy Bỏ</a>
              <button type="submit" class="btn btn-primary">Lưu Tài Khoản</button>
            </div>
          </div>

          <div class="form-grid-2" style="grid-template-columns: 1fr 320px;">
            
            <div class="card-block">
              <h3 class="card-title" style="margin-bottom:20px;">Thông Tin Cá Nhân & Đăng Nhập</h3>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Họ Và Tên <span style="color:red;">*</span></label>
                  <input type="text" class="form-control" value="Trần Tuấn Anh" required>
                </div>

                <div class="form-group">
                  <label class="form-label">Số Điện Thoại <span style="color:red;">*</span></label>
                  <input type="tel" class="form-control" value="0903 111 222" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Địa Chỉ Email <span style="color:red;">*</span></label>
                <input type="email" class="form-control" value="tuananh.florist@vuonhoatuoi.vn" required>
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Mật Khẩu Mới</label>
                  <input type="password" class="form-control" placeholder="Để trống nếu không đổi">
                </div>

                <div class="form-group">
                  <label class="form-label">Xác Nhận Mật Khẩu</label>
                  <input type="password" class="form-control" placeholder="Nhập lại mật khẩu">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Ghi Chú Về Tài Khoản</label>
                <textarea class="form-control" rows="3" placeholder="Ghi chú công việc, chi nhánh phụ trách...">Nhân viên florist phụ trách cắm bó hoa Tulip và hoa khai trương tại Showroom Quận 3.</textarea>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:24px;">
              <div class="card-block">
                <h3 class="card-title" style="margin-bottom:16px;">Ảnh Đại Diện</h3>
                <div style="text-align:center;">
                  <img id="user-avatar-preview" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--color-primary-light); margin-bottom:12px;" alt="Avatar">
                  <input type="file" class="form-control image-upload-input" data-preview-target="user-avatar-preview">
                </div>
              </div>

              <div class="card-block">
                <h3 class="card-title" style="margin-bottom:16px;">Phân Quyền Vai Trò</h3>

                <div class="form-group">
                  <label class="form-label">Vai Trò Hệ Thống</label>
                  <select class="form-control">
                    <option value="staff" selected>Nhân Viên Tiệm Hoa (Florist)</option>
                    <option value="admin">Quản Trị Viên (Super Admin)</option>
                    <option value="shipper">Nhân Viên Giao Hỏa Tốc</option>
                    <option value="customer">Khách Hàng Thường</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Trạng Thái Tài Khoản</label>
                  <select class="form-control">
                    <option value="active" selected>Đang Hoạt Động</option>
                    <option value="locked">Tạm Khóa (Banned)</option>
                  </select>
                </div>
              </div>
            </div>

          </div>
        </form>
      </div>
  </div>
</body>
</html>
