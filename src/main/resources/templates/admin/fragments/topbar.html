<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="topbar" class="admin-topbar">
    <div class="topbar-left">
      <button class="toggle-sidebar-btn" aria-label="Toggle Navigation">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="admin-page-title" th:text="${pageTitle ?: 'Quản Trị Hệ Thống'}">Tổng Quan Hệ Thống</h1>
    </div>

    <div class="topbar-right">
      <div class="topbar-search">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="Tìm đơn hàng, khách hàng...">
      </div>

      <div class="icon-btn-wrap">
        <button class="icon-btn" title="Thông báo đơn mới">
          <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
        <span class="icon-badge">3</span>
      </div>

      <div class="admin-user-profile">
        <img class="admin-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop" alt="Avatar Admin">
        <div class="admin-user-info">
          <span class="admin-name">Nguyễn Văn Quản Lý</span>
          <span class="admin-role">Super Admin</span>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
