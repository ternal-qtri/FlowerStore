<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
  <title th:text="${pageTitle} + ' - Vườn Hoa Tươi Admin'">Chi Tiết Mẫu Hoa - Vườn Hoa Tươi Admin</title>
</head>
<body>
  <div layout:fragment="content">
    <div class="admin-content">
      <form th:action="@{/admin/products/save}" th:object="${product}" method="POST">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="page" th:value="${page}">

        <div class="page-header-row">
          <div class="page-header-text">
            <h2 th:text="${product.id != null} ? 'Cập Nhật Mẫu Hoa #' + ${product.id} : 'Thêm Mẫu Hoa Mới'">Chi Tiết Mẫu Hoa Tươi</h2>
            <p>Điền thông tin mô tả, giá bán và dán link ảnh mẫu hoa online.</p>
          </div>
          <div style="display:flex; gap:12px;">
            <a th:href="@{/admin/products(page=${page})}" class="btn btn-outline">Hủy Bỏ</a>
            <button type="submit" class="btn btn-primary" th:text="${product.id != null} ? 'Cập Nhật Sản Phẩm' : 'Lưu Sản Phẩm'">Lưu Sản Phẩm</button>
          </div>
        </div>

        <div class="form-grid-2" style="grid-template-columns: 1fr 340px;">
          
          <!-- THÔNG TIN CHÍNH -->
          <div class="card-block">
            <h3 class="card-title" style="margin-bottom:20px;">Thông Tin Cơ Bản</h3>

            <div class="form-group">
              <label class="form-label">Tên Mẫu Hoa <span style="color:red;">*</span></label>
              <input type="text" th:field="*{name}" class="form-control" placeholder="Ví dụ: Bó Hoa Tulip White July - Trắng Tinh Khôi">
              <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">Đường Dẫn Slug <span style="color:red;">*</span></label>
                <input type="text" th:field="*{slug}" class="form-control" placeholder="bo-hoa-tulip-white-july">
                <span th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
              </div>

              <div class="form-group">
                <label class="form-label">Danh Mục Chính <span style="color:red;">*</span></label>
                <select th:field="*{category.id}" class="form-control">
                  <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Bó Hoa Tươi</option>
                </select>
                <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">Giá Bán (₫) <span style="color:red;">*</span></label>
                <input type="number" th:field="*{price}" class="form-control" placeholder="650000">
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
              </div>

              <div class="form-group">
                <label class="form-label">Giá Gốc Niêm Yết (₫)</label>
                <input type="number" th:field="*{oldPrice}" class="form-control" placeholder="750000">
                <span th:if="${#fields.hasErrors('oldPrice')}" th:errors="*{oldPrice}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Thành Phần Hoa & Phụ Kiện</label>
              <textarea th:field="*{composition}" class="form-control" rows="3" placeholder="Nhập chi tiết: 10 bông Tulip trắng Hà Lan, lá bạc nhập khẩu, giấy gói lụa cao cấp..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Mô Tả Sản Phẩm & Ý Nghĩa</label>
              <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Viết câu chuyện và thông điệp của bó hoa..."></textarea>
            </div>
          </div>

          <!-- ẢNH SẢN PHẨM & CẤU HÌNH -->
          <div style="display:flex; flex-direction:column; gap:24px;">
            <div class="card-block">
              <h3 class="card-title" style="margin-bottom:16px;">Hình Ảnh Đại Diện</h3>
              <div class="form-group">
                <label class="form-label">Đường Dẫn URL Ảnh <span style="color:red;">*</span></label>
                <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/..."
                       oninput="document.getElementById('product-main-preview').src = this.value">
                <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" style="color:#D32F2F; font-size:0.8rem; margin-top:4px; display:block;"></span>
                <div style="margin-top:12px;">
                  <img id="product-main-preview"
                       th:src="${product.imageUrl != null and !product.imageUrl.isBlank() ? product.imageUrl : 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=600&auto=format&fit=crop'}"
                       style="width:100%; height:220px; object-fit:cover; border-radius:8px; border:1px solid #ECECEC;" alt="Ảnh đại diện">
                </div>
              </div>
            </div>

            <div class="card-block">
              <h3 class="card-title" style="margin-bottom:16px;">Trạng Thái & Badge</h3>

              <div class="form-group">
                <label class="form-label">Huy Hiệu Nổi Bật</label>
                <select th:field="*{badgeTag}" class="form-control">
                  <option value="">Không có huy hiệu</option>
                  <option value="Sale">Sale (Đỏ)</option>
                  <option value="Hot">Hot (Vàng)</option>
                  <option value="Mới">Mới (Xanh lá)</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Trạng Thái Hiển Thị</label>
                <select th:field="*{active}" class="form-control">
                  <option th:value="true">Đang Bán Trên Store</option>
                  <option th:value="false">Tạm Ẩn</option>
                </select>
              </div>
            </div>
          </div>

        </div>
      </form>
    </div>
  </div>
</body>
</html>
