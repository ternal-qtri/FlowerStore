<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout}">
<head>
  <title>Quên Mật Khẩu - Vườn Hoa Tươi HCM</title>
</head>
<body>
  <div layout:fragment="content">
<!-- ================= BREADCRUMB ================= -->
  <div class="breadcrumb-wrap" style="background-color: var(--color-bg-warm); padding: 12px 0; border-bottom: 1px solid var(--color-border-light);">
    <div class="container">
      <ul class="breadcrumb-list" style="display: flex; gap: 8px; font-size: 0.88rem; color: var(--color-text-muted);">
        <li><a th:href="@{/}" href="/" style="color: var(--color-primary);">Trang Chủ</a></li>
        <li class="breadcrumb-separator">/</li>
        <li><a th:href="@{/login}" href="/login" style="color: var(--color-primary);">Đăng Nhập</a></li>
        <li class="breadcrumb-separator">/</li>
        <li style="color: var(--color-text-main); font-weight: 500;">Quên Mật Khẩu</li>
      </ul>
    </div>
  </div>

  <!-- ================= AUTH SECTION (FORGOT PASSWORD FORM) ================= -->
  <section class="auth-section">
    <div class="container">
      <div class="auth-card">
        
        <div class="auth-header">
          <span class="auth-subtitle">Khôi phục quyền truy cập</span>
          <h1 class="auth-title">Quên Mật Khẩu?</h1>
          <p style="font-size: 0.88rem; color: var(--color-text-muted); margin-top: 10px; line-height: 1.5;">
            Vui lòng nhập Email hoặc Số điện thoại đã đăng ký. Chúng tôi sẽ gửi hướng dẫn khôi phục mật khẩu cho bạn ngay lập tức.
          </p>
        </div>

        <form th:action="@{/login}" action="/login" method="GET">
          
          <!-- Input Email/SĐT -->
          <div class="form-group">
            <label class="form-label" for="reset-identity">Email hoặc Số điện thoại đã đăng ký <span class="required">*</span></label>
            <div class="input-wrap">
              <input type="text" id="reset-identity" class="form-input" placeholder="Ví dụ: nguyenvanan@gmail.com hoặc 090xxxxxxx" required>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-full" style="padding: 13px; font-weight: 600; font-size: 0.95rem; margin-top: 10px;">
            GỬI MÃ XÁC NHẬN KHÔI PHỤC
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>Quay lại trang khác</span>
        </div>

        <div class="auth-footer-link" style="display: flex; justify-content: space-between; gap: 10px;">
          <span>Nhớ mật khẩu? <a th:href="@{/login}" href="/login">Đăng nhập</a></span>
          <span>Chưa có tài khoản? <a th:href="@{/register}" href="/register">Đăng ký</a></span>
        </div>

      </div>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  </div>
</body>
</html>
