<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout}">
<head>
  <title>Thông Tin Tài Khoản - Vườn Hoa Tươi HCM</title>
</head>
<body>
  <div layout:fragment="content">
<!-- ================= BREADCRUMB ================= -->
  <div class="breadcrumb-bar">
    <div class="container">
      <ul class="breadcrumb-list">
        <li class="breadcrumb-item"><a th:href="@{/}" href="/">Trang chủ</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item"><a th:href="@{/profile}" href="/profile">Tài khoản của tôi</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item active">Thông tin cá nhân</li>
      </ul>
    </div>
  </div>

  <!-- ================= ACCOUNT SECTION ================= -->
  <main class="account-section">
    <div class="container">
      <div class="account-layout">
        
        <!-- Left Sidebar Navigation -->
        <aside class="account-sidebar">
          <div class="account-user-box">
            <div class="account-user-avatar">AN</div>
            <div>
              <div class="account-user-name">Nguyễn Văn An</div>
              <span class="account-user-badge">⭐ Thành viên Thân Thiết (1.250 điểm)</span>
            </div>
          </div>

          <nav class="account-nav">
            <a th:href="@{/profile}" href="/profile" class="account-nav-link active">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span>Thông tin tài khoản</span>
            </a>
            <a th:href="@{/my-orders}" href="/my-orders" class="account-nav-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
              <span>Đơn hàng của tôi (2)</span>
            </a>
            <a th:href="@{/change-password}" href="/change-password" class="account-nav-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              <span>Đổi mật khẩu</span>
            </a>
            <a th:href="@{/login}" href="/login" class="account-nav-link" style="color: var(--color-accent); margin-top: 8px;">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              <span>Đăng xuất</span>
            </a>
          </nav>
        </aside>

        <!-- Right Content: Profile Update Form -->
        <section class="account-content-card">
          <h1 class="account-content-title">Hồ Sơ Cá Nhân</h1>

          <form action="#" method="POST" onsubmit="alert('Đã cập nhật thông tin tài khoản thành công!'); return false;">
            
            <div class="form-row-2">
              <div class="form-group">
                <label for="profile-fullname" class="form-label">Họ và tên <span class="required">*</span></label>
                <input type="text" id="profile-fullname" class="form-input" value="Nguyễn Văn An" required>
              </div>
              <div class="form-group">
                <label for="profile-phone" class="form-label">Số điện thoại <span class="required">*</span></label>
                <input type="tel" id="profile-phone" class="form-input" value="0909123456" required>
              </div>
            </div>

            <div class="form-row-2">
              <div class="form-group">
                <label for="profile-email" class="form-label">Địa chỉ Email <span class="required">*</span></label>
                <input type="email" id="profile-email" class="form-input" value="nguyenvanan@gmail.com" required>
              </div>
              <div class="form-group">
                <label for="profile-dob" class="form-label">Ngày sinh</label>
                <input type="date" id="profile-dob" class="form-input" value="1995-08-15">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Giới tính</label>
              <div style="display: flex; gap: 20px; margin-top: 6px;">
                <label class="checkbox-label">
                  <input type="radio" name="gender" value="male" checked> Nam
                </label>
                <label class="checkbox-label">
                  <input type="radio" name="gender" value="female"> Nữ
                </label>
                <label class="checkbox-label">
                  <input type="radio" name="gender" value="other"> Khác
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="profile-address" class="form-label">Địa chỉ nhận hoa mặc định</label>
              <input type="text" id="profile-address" class="form-input" value="704/19 Nguyễn Đình Chiểu, Phường 1, Quận 3, TP. Hồ Chí Minh">
            </div>

            <div style="margin-top: 24px;">
              <button type="submit" class="btn btn-primary" style="padding: 12px 28px; font-weight: 600;">LƯU THAY ĐỔI</button>
            </div>

          </form>
        </section>

      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  </div>
</body>
</html>
