<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout}">
<head>
  <title>Đăng Ký Tài Khoản Mới - Vườn Hoa Tươi</title>
</head>
<body>
  <div layout:fragment="content">
<!-- ================= BREADCRUMB ================= -->
  <div class="breadcrumb-wrap">
    <div class="container">
      <ul class="breadcrumb-list">
        <li><a th:href="@{/}" href="/">Trang Chủ</a></li>
        <li class="breadcrumb-separator">/</li>
        <li style="color: var(--color-text-main); font-weight: 500;">Đăng Ký Tài Khoản</li>
      </ul>
    </div>
  </div>

  <!-- ================= AUTH SECTION (REGISTER FORM) ================= -->
  <section class="auth-section">
    <div class="container">
      <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
          <span class="auth-subtitle">Thành viên Vườn Hoa Tươi</span>
          <h1 class="auth-title">Tạo Tài Khoản Mới</h1>
        </div>

        <form th:action="@{/login}" action="/login" method="GET">
          <!-- Họ và tên -->
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Họ và tên của bạn <span class="required">*</span></label>
            <div class="input-wrap">
              <input type="text" id="reg-fullname" class="form-input" placeholder="Ví dụ: Nguyễn Văn An" value="Nguyễn Hoàng Nam" required>
            </div>
          </div>

          <!-- Số điện thoại & Email -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="reg-phone">Số điện thoại <span class="required">*</span></label>
              <div class="input-wrap">
                <input type="tel" id="reg-phone" class="form-input" placeholder="090xxxxxxx" value="0912345678" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-email">Địa chỉ Email <span class="required">*</span></label>
              <div class="input-wrap">
                <input type="email" id="reg-email" class="form-input" placeholder="email@domain.com" value="hoangnam@gmail.com" required>
              </div>
            </div>
          </div>

          <!-- Mật khẩu & Xác nhận mật khẩu -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="reg-password">Mật khẩu <span class="required">*</span></label>
              <div class="input-wrap">
                <input type="password" id="reg-password" class="form-input" placeholder="Tối thiểu 6 ký tự" value="12345678" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-confirm-password">Xác nhận mật khẩu <span class="required">*</span></label>
              <div class="input-wrap">
                <input type="password" id="reg-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu" value="12345678" required>
              </div>
            </div>
          </div>

          <!-- Điều khoản & chính sách -->
          <div class="form-group">
            <label class="checkbox-label" style="font-size: 0.86rem; align-items: flex-start;">
              <input type="checkbox" checked required style="margin-top: 3px;">
              <span>Tôi đồng ý với <a href="#" style="color: var(--color-primary); font-weight: 500;">Điều khoản dịch vụ</a> và <a href="#" style="color: var(--color-primary); font-weight: 500;">Chính sách bảo mật</a> của Vườn Hoa Tươi.</span>
            </label>
          </div>

          <!-- Nút Đăng ký -->
          <button type="submit" class="btn btn-primary btn-full" style="padding: 12px;">Đăng Ký Tài Khoản Mới</button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>Hoặc đăng ký nhanh bằng</span>
        </div>

        <!-- Social Register buttons -->
        <div class="social-auth">
          <button type="button" class="btn-social">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.3C.6 9.3 0 11.6 0 14s.6 4.7 1.6 6.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.4-6.7-5.3L1.6 16c1.9 3.8 5.8 7 10.4 7z"/></svg>
            Tài Khoản Google
          </button>
          <button type="button" class="btn-social">
            <svg style="width:18px;height:18px;" fill="#0068FF" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.5 5.43 3.86 7.02l-.96 3.56c-.1.38.27.71.63.57l4.02-1.62c.79.23 1.62.36 2.45.36 5.52 0 10-4.03 10-9s-4.48-9-10-9z"/></svg>
            Tài Khoản Zalo
          </button>
        </div>

        <!-- Link tới Đăng nhập -->
        <div class="auth-footer-link">
          Đã có tài khoản thành viên? <a th:href="@{/login}" href="/login">Đăng nhập tại đây</a>
        </div>

      </div>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  </div>
</body>
</html>
